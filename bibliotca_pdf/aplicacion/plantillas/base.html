<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Biblioteca PDF{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilo.css') }}">
</head>

<body>

    <header class="encabezado">

        <div class="logo">
            <a href="{{ url_for('biblioteca.inicio') }}">
                Biblioteca PDF
            </a>
        </div>

        <nav class="navegacion">

            <a href="{{ url_for('biblioteca.inicio') }}">
                Inicio
            </a>

            <a href="{{ url_for('biblioteca.biblioteca') }}">
                Biblioteca
            </a>

            <a href="{{ url_for('grupos.grupos') }}">
                Grupos
            </a>

        </nav>

    </header>

    <main class="contenido">

        {% block contenido %}
        {% endblock %}

    </main>

    <footer class="pie_pagina">

        <p>
            Biblioteca PDF - Proyecto personal
        </p>

    </footer>

</body>

</html>
